<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">

<meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><title>МЕТА · Инструменты</title>
<style>:root{--blue:#1768d4;--ink:#171916;--muted:#777d76;--line:#dfe2dc;--bg:#f5f6f4}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}body{display:flex;flex-direction:column;overflow:hidden}.bar{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:26px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);z-index:3}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--ink)}.mark{font-family:"Arial Narrow","Roboto Condensed",sans-serif;font-size:24px;font-weight:800;letter-spacing:-.06em}.brand-copy{display:flex;flex-direction:column;line-height:1.05}.brand-name{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--blue)}.project{margin-top:4px;font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;align-self:stretch;gap:24px;min-width:0}.nav button{position:relative;border:0;background:transparent;color:var(--blue);opacity:.66;padding:2px 0 0;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.nav button:hover{opacity:.86}.nav button.active{color:var(--blue);opacity:1}.nav button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--blue)}.actions{margin-left:auto;display:flex;align-items:center;gap:12px}.transfer{display:none;border:0;background:var(--ink);color:#fff;border-radius:5px;padding:10px 14px;font-weight:700;cursor:pointer}.transfer:hover{background:var(--blue)}.transfer.show{display:block}.status{font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}.stage{position:relative;flex:1;min-height:0}.tool{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.tool.active{display:block}@media(max-width:840px){.bar{height:auto;min-height:62px;flex-wrap:wrap;padding:9px 12px}.nav{order:3;width:100%;height:38px;overflow:auto}.brand{flex:1}.status{display:none}.actions{margin-left:0}}</style></head>
<body><header class="bar"><div class="brand"><span class="mark">META</span><span class="brand-copy"><span class="brand-name">ИНСТРУМЕНТЫ</span><span class="project">Жилая платформа · эскиз</span></span></div><nav class="nav" aria-label="Инструменты"><button data-tool="catalog">01 Каталог квартир</button><button data-tool="configurator" class="active">02 Конфигуратор этажа</button><button data-tool="massing">03 Мета Массинг</button></nav><div class="actions"><span class="status" id="status">Private link · noindex</span><button class="transfer" id="transfer">Передать в Массинг →</button></div></header>
<main class="stage"><iframe class="tool" id="catalog" title="Каталог квартир" data-src="catalog/index.html?embed=1"></iframe><iframe class="tool active" id="configurator" title="Конфигуратор этажа" src="configurator.html?embed=1&amp;v=section-roundtrip-20261113a"></iframe><iframe class="tool" id="massing" title="Мета Массинг" data-src="massing.html?embed=1&amp;v=junction-zebra-sidewalk-20261113a"></iframe></main>
<script>
const buttons=[...document.querySelectorAll('[data-tool]')],frames=[...document.querySelectorAll('.tool')],transfer=document.getElementById('transfer'),status=document.getElementById('status');
let pendingSectionContext=null;
try{const saved=JSON.parse(sessionStorage.getItem('meta-section-context-v1')||'null');if(saved&&saved.section&&Date.now()-Date.parse(saved.meta?.created||'')<30*60*1000)pendingSectionContext=saved.section;else sessionStorage.removeItem('meta-section-context-v1');}catch(e){}
function show(id){if(!document.getElementById(id))id='configurator';buttons.forEach(b=>b.classList.toggle('active',b.dataset.tool===id));frames.forEach(f=>f.classList.toggle('active',f.id===id));const f=document.getElementById(id);if(!f.getAttribute('src')&&f.dataset.src)f.src=f.dataset.src;transfer.classList.toggle('show',id==='configurator');history.replaceState(null,'','#'+id)}
buttons.forEach(b=>b.onclick=()=>show(b.dataset.tool));
transfer.onclick=()=>{try{const api=document.getElementById('configurator').contentWindow;if(!api||typeof api.getMetaMassingPayload!=='function')throw new Error('Сначала выберите вариант планировки на рабочем пространстве');const payload=api.getMetaMassingPayload();if(pendingSectionContext){payload.replaceTargetId=pendingSectionContext.id;payload.sourceSection=pendingSectionContext;}localStorage.setItem('meta-floor-transfer-v1',JSON.stringify(payload));status.textContent=pendingSectionContext?'План выбран · секция будет заменена в Массинге':'Передан план '+payload.bounds.width_m.toFixed(1)+' × '+payload.bounds.depth_m.toFixed(1)+' м';show('massing');setTimeout(()=>document.getElementById('massing').contentWindow.postMessage({type:'META_FLOOR_IMPORT',payload},location.origin),500)}catch(e){alert(e.message||e)}};
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||!e.data)return;
 if(e.data.type==='META_SECTION_CONFIGURE'){
  const payload=e.data.payload;if(!payload||!payload.section)return;
  pendingSectionContext=payload.section;try{sessionStorage.setItem('meta-section-context-v1',JSON.stringify(payload));}catch(err){}
  status.textContent='Секция '+(payload.section.label||payload.section.id)+' передана в Конфигуратор';
  show('configurator');
  setTimeout(()=>document.getElementById('configurator').contentWindow.postMessage({type:'META_SECTION_CONFIGURE',payload},location.origin),150);
  return;
 }
 if(e.data.type==='META_SECTION_CONFIGURATOR_RECEIVED'){status.textContent='Параметры секции загружены в Конфигуратор';return;}
 if(e.data.type==='META_MASSING_IMPORTED'){
  const replaced=!!e.data.replaced;pendingSectionContext=null;try{sessionStorage.removeItem('meta-section-context-v1');}catch(err){}
  document.getElementById('configurator').contentWindow.postMessage({type:'META_SECTION_CONFIGURE_DONE'},location.origin);
  status.textContent=replaced?'Секция заменена планировкой из Конфигуратора':'План этажа добавлен в Мета Массинг';
 }
});
show(location.hash.slice(1)||'configurator');
</script></body></html>
